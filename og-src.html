<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Great+Vibes&family=Cormorant+Garamond:ital@0;1&family=Jost:wght@300;400&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>
body { margin:0; width:1200px; height:630px; overflow:hidden; background:#3B0A14; }
.cover { width:1200px; height:630px; position:relative;
  background:
    radial-gradient(120% 100% at 50% -10%, #6B1826 0%, rgba(107,24,38,0) 55%),
    radial-gradient(90% 90% at 50% 118%, #2c050d 0%, rgba(44,5,13,0) 60%),
    linear-gradient(180deg, #4E0E1B 0%, #3B0A14 100%);
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
.mandala { position:absolute; right:-170px; top:-130px; width:520px; opacity:.14; }
.toran { position:absolute; top:-6px; left:50%; transform:translateX(-50%); width:820px; max-width:none; }
.ganesha { width:92px; filter: drop-shadow(0 6px 16px rgba(0,0,0,.55)); margin:118px 0 12px; }
.shloka { font-family:'Tiro Devanagari Hindi',serif; font-size:20px; color:#F0D488; letter-spacing:.08em; }
.eyebrow { font-family:'Cormorant Garamond',serif; font-style:italic; font-size:19px; letter-spacing:.06em; color:rgba(243,228,200,.78); margin-top:14px; }
.names { font-family:'Rozha One',serif; font-size:74px; line-height:1.05; margin-top:8px;
  background:linear-gradient(172deg,#f4e3a4 6%,#dcb656 34%,#c39339 52%,#f0d68c 70%,#a87c28 96%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.62)); }
.names .amp { font-family:'Great Vibes',cursive; font-size:60px; }
.line { width:340px; height:44px; margin:2px 0 0; color:#D3A63E; }
.date { font-family:'Jost',sans-serif; font-size:16px; letter-spacing:.4em; text-transform:uppercase; color:#C9A02F; margin-top:12px; }
.sub { margin-top:8px; font-family:'Cormorant Garamond',serif; font-style:italic; font-size:21px; color:rgba(243,228,200,.85); }
.paisley { position:absolute; width:54px; color:#D3A63E; opacity:.5; }
.pl { left:56px; top:120px; transform:scaleX(-1) rotate(-14deg); }
.pr { right:56px; top:120px; transform:rotate(-14deg); }
.wordmark { position:absolute; bottom:22px; left:0; right:0; font-family:'Jost',sans-serif;
  font-size:11px; letter-spacing:.5em; text-transform:uppercase; color:rgba(211,166,62,.55); }
</style></head>
<body>
<div class="cover">
  <img class="mandala" src="assets/art/mandala.png" alt="">
  <img class="toran" src="assets/art/toran.png" alt="">
  <svg class="paisley pl" viewBox="-14 -16 28 30"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M 10.4 -8.4 C 5.4 -11 -1 -10 -4.6 -6.6 C -9 -2.4 -9.2 5 -4.8 8.8 C -0.4 12.6 6.2 12 9.2 8 C 11.2 5.2 11.2 1 9 -1.8 C 10.2 -3.6 10.8 -5.8 10.4 -8.4 Z"/><circle cx="0.2" cy="2.4" r="1.5" fill="currentColor"/></svg>
  <svg class="paisley pr" viewBox="-14 -16 28 30"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M 10.4 -8.4 C 5.4 -11 -1 -10 -4.6 -6.6 C -9 -2.4 -9.2 5 -4.8 8.8 C -0.4 12.6 6.2 12 9.2 8 C 11.2 5.2 11.2 1 9 -1.8 C 10.2 -3.6 10.8 -5.8 10.4 -8.4 Z"/><circle cx="0.2" cy="2.4" r="1.5" fill="currentColor"/></svg>
  <img class="ganesha" src="assets/art/ganesha.png" alt="">
  <div class="shloka">॥ श्री गणेशाय नमः ॥</div>
  <div class="eyebrow">Together with their families</div>
  <div class="names">Meera <span class="amp">&amp;</span> Aarav</div>
  <svg class="line" viewBox="0 0 320 44"><path fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" d="M12 22 L 118 22 M202 22 L 308 22"/><circle cx="128" cy="22" r="1.6" fill="currentColor"/><circle cx="192" cy="22" r="1.6" fill="currentColor"/><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" d="M159.4 32.6 C 165.6 31.8 170 26.8 169.8 21.4 C 169.6 15.6 164.6 11.2 158.8 11.4 C 153.4 11.6 149.4 15.8 149.4 21 C 149.4 25.6 152.8 29.2 157.2 29.4 C 160.7 29.5 163.5 27 163.5 23.9 C 163.5 21.2 161.4 19.1 158.9 19.1 C 156.8 19.1 155.1 20.7 155.1 22.7"/><circle cx="158.9" cy="21.9" r="1.5" fill="currentColor"/></svg>
  <div class="date">20 · 11 · 2027 · Jaipur</div>
  <div class="sub">Haldi, Mehndi, Sangeet &amp; the sacred Pheras</div>
  <div class="wordmark">Shubh Vivah</div>
</div>
</body></html>
